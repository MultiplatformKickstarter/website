<header class="header" role="banner">
  <div class="container">
    <div class="logo">
      <a class="logo-title" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Params.logo.alt }} home">
        {{- with .Site.Params.logo.desktop -}}
        <img height="{{ $.Site.Params.logo.desktop_height }}" alt="{{ $.Site.Params.logo.alt }}" src="{{ . | relURL }}" loading="eager">
        {{- end -}}
        {{ .Site.Params.logo.alt }}
      </a>
    </div>
    <div class="logo-mobile">
      <a class="logo-title" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Params.logo.alt }} home">
        {{- with .Site.Params.logo.mobile -}}
        <img height="{{ $.Site.Params.logo.mobile_height }}" alt="{{ $.Site.Params.logo.alt }}" src="{{ . | relURL }}" loading="eager">
        {{- end -}}
        {{ .Site.Params.logo.alt }}
      </a>
    </div>
    {{ partial "main-menu.html" . }}
    {{ partial "hamburger.html" . }}
  </div>
</header>
