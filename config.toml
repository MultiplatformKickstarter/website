baseURL = "https://multiplatformkickstarter.com/"
themesDir = "themes"
theme = "hugo-serif-theme"
languageCode = "en-us"
title = "Multiplatform Kickstarter — Local AI App Builder for Kotlin Multiplatform"
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  google_analytics_id = ""
  google_tag_manager_id = ""
  favicon = "favicon-32x32.png"
  showPricing = false

  description = "Generate Kotlin Multiplatform apps from prompts. Build Android, iOS, desktop, and WASM projects with Compose Multiplatform — privately, on your machine."

  # Lemon Squeezy checkout URLs — replace these with your real checkout links
  lemon_squeezy_pro_monthly_url = "https://multiplatformkickstarter.lemonsqueezy.com/checkout/buy/REPLACE_PRO_MONTHLY"
  lemon_squeezy_pro_yearly_url  = "https://multiplatformkickstarter.lemonsqueezy.com/checkout/buy/REPLACE_PRO_YEARLY"
  lemon_squeezy_lifetime_url    = "https://multiplatformkickstarter.lemonsqueezy.com/checkout/buy/REPLACE_LIFETIME"

  [params.homepage]
    show_contact_box = false
    show_services_button = false
    show_pricing_button = false

  [params.logo]
    mobile = "images/logo/MKLogo.svg"
    mobile_height = "36px"
    desktop = "images/logo/MKLogo.svg"
    desktop_height = "36px"
    alt = "Multiplatform Kickstarter"

  [params.fonts]
    google_fonts = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'
    heading = "Inter"
    base = "Inter"

  [params.colors]
    primary = "#6C63FF"
    black = "#0f0f1a"
    white = "#ffffff"
    white_offset = "#f8f7ff"
    grey = "#6b7280"

  [params.seo]
    meta_twitter_site = "@mpkickstarter"
    meta_twitter_creator = "@mpkickstarter"
    meta_og_image = "https://multiplatformkickstarter.com/images/og-image.png"

  [params.footer]
    copyright_text = 'Copyright &copy; 2023–2025 Multiplatform Kickstarter. All rights reserved.'

[languages]
  [languages.en]
    contentDir = 'content/en'
    disabled = false
    languageCode = 'en-US'
    languageDirection = 'ltr'
    languageName = 'English'
    title = 'Multiplatform Kickstarter — Local AI App Builder for Kotlin Multiplatform'
    weight = 0

[menu]
  [[menu.main]]
    name = "How it works"
    url = "/#how-it-works"
    weight = 1

  [[menu.main]]
    name = "Features"
    url = "/#features"
    weight = 2

  [[menu.main]]
    name = "Pricing"
    url = "/pricing/"
    weight = 3

  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 4

  [[menu.main]]
    name = "Download"
    url = "/download/"
    weight = 5

  # Footer Menu
  [[menu.footer]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.footer]]
    name = "Pricing"
    url = "/pricing/"
    weight = 2

  [[menu.footer]]
    name = "Download"
    url = "/download/"
    weight = 3

  [[menu.footer]]
    name = "Blog"
    url = "/blog/"
    weight = 4

  [[menu.footer]]
    name = "FAQ"
    url = "/#faq"
    weight = 5

  [[menu.footer]]
    name = "Privacy"
    url = "/privacy/"
    weight = 6

  [[menu.footer]]
    name = "Terms"
    url = "/terms/"
    weight = 7
